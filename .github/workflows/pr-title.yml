name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          # Release Please uses chore(main) for this repository's release PR.
          scopes: |
            share
            agent
            config
            service
            frpc
            audit
            release
            main
            ci
            docs
            deps
            other
          requireScope: false
          subjectPattern: ^[A-Za-z].*$
          subjectPatternError: |
            Subject must start with a letter.
            Example: "feat(share): add lifecycle status helper"
