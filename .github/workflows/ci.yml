name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "**.md"
      - ".gitignore"
      - "LICENSE"
      - "docs/**"

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: ./pkg/... ./cmd/... ./internal/...
      # The pinned action above installs its exact binary on PATH for this
      # same job; reuse it under GOOS=windows so Windows-only files are linted.
      - name: Cross-lint Windows sources
        run: |
          command -v golangci-lint
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 golangci-lint run ./pkg/... ./cmd/... ./internal/...
      - name: Cross-lint Darwin sources
        run: GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 golangci-lint run ./pkg/... ./cmd/... ./internal/...

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run tests
        run: make test
      - name: Run Linux systemd user-job integration
        run: |
          set -euo pipefail
          user_id="$(id -u)"
          user_name="$(id -un)"
          export XDG_RUNTIME_DIR="/run/user/${user_id}"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=${XDG_RUNTIME_DIR}/bus"
          test_name="TestLinuxUserJobManagerIntegration"
          test_output="$(mktemp)"
          cleanup() {
            systemctl --user disable --now ai.layerv.qurl.integration.service 2>/dev/null || true
            sudo loginctl disable-linger "$user_name" 2>/dev/null || true
            rm -f -- "$test_output"
          }
          trap cleanup EXIT
          sudo loginctl enable-linger "$user_name"
          sudo systemctl start "user@${user_id}.service"
          for _ in $(seq 1 50); do
            [[ -S "${XDG_RUNTIME_DIR}/bus" ]] && break
            sleep 0.2
          done
          [[ -S "${XDG_RUNTIME_DIR}/bus" ]] || {
            echo "systemd user bus is unavailable" >&2
            exit 1
          }
          systemctl --user show-environment >/dev/null
          test_list="$(go test -list "^${test_name}$" ./pkg/service)"
          listed="$(printf '%s\n' "$test_list" | sed -n "/^${test_name}$/p")"
          [[ "$listed" == "$test_name" ]] || {
            echo "required integration test was not enumerated: ${test_name}" >&2
            exit 1
          }
          QURL_LINUX_USER_JOB_INTEGRATION=1 \
            go test -v -count=1 -run "^${test_name}$" ./pkg/service | tee "$test_output"
          grep -qF -- "--- PASS: ${test_name} " "$test_output" || {
            echo "required integration test did not report PASS: ${test_name}" >&2
            exit 1
          }
      # cmd/frpc is a developer command, not a released customer artifact. It
      # must stay fail-closed unless the operator supplies an explicit custom
      # Hub trust configuration.
      - name: Assert developer command stays dark by default
        run: |
          make frpc
          ./bin/qurl-connector version
          ./bin/qurl-connector version | grep -qF 'hub trust pin: none (dark build'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out

  # qURL Desktop ships on Darwin and depends on the local-key descriptor
  # transport added for its OS-keystore bridge. Keep the Darwin-only anonymous
  # pipe and socketpair checks executable in CI rather than relying on local
  # developer runs.
  darwin-test:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run Darwin tests
        run: |
          CGO_ENABLED=0 go vet ./pkg/service
          CGO_ENABLED=0 go test -count=1 ./pkg/agentstate ./pkg/config ./pkg/service ./cmd/frpc ./internal/pinnedfs

  windows-test:
    name: Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run Windows user-job tests
        shell: bash
        env:
          QURL_WINDOWS_USER_JOB_INTEGRATION: "1"
        run: |
          go build ./...
          go vet ./pkg/service
          CGO_ENABLED=0 go test -count=1 ./pkg/service

  # The race detector requires cgo, so this lane builds with CGO_ENABLED=1 —
  # the only place in CI that does. `make test` keeps proving the CGO_ENABLED=0
  # build; this lane exists because a suite that is never run under -race
  # cannot catch the data races its concurrency tests claim to cover.
  race:
    name: Race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run tests under the race detector
        run: make test-race

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
      - name: Verify FRP provenance
        run: ./scripts/verify-frp-provenance.sh
      - name: Run govulncheck
        run: govulncheck ./...

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run shellcheck
        run: shellcheck scripts/verify-frp-provenance.sh

  notify-main-failure:
    name: Notify Slack of main CI failure
    needs: [lint, test, darwin-test, windows-test, race, security, shellcheck]
    if: ${{ always() && !cancelled() && github.event_name == 'push' && contains(needs.*.result, 'failure') }}
    uses: ./.github/workflows/slack-notify.yml
    with:
      title: qurl-connector CI
      results: ${{ toJSON(needs) }}
    secrets:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
