name: Validate Workflows

on:
  push:
    branches: [main]
  pull_request:

# The source sanitizer must run for every file type, including documentation,
# fixtures, and generated assets. Path filters would create an avoidable gap.

permissions:
  contents: read
  pull-requests: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: reviewdog/action-actionlint@dbe5299849118fd6f099ba563d263d770955a64a # v1.73.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install pinned Python linter
        run: python3 -m pip install ruff==0.15.8
      - name: Lint sandbox enrollment recovery
        run: |
          python3 -m ruff check .github/scripts/prepare-headless-enrollment.py .github/scripts/prepare_headless_enrollment_test.py
          python3 -m ruff format --check .github/scripts/prepare-headless-enrollment.py .github/scripts/prepare_headless_enrollment_test.py
      - name: Test sandbox enrollment recovery
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s .github/scripts -p 'prepare_headless_enrollment_test.py'
      - name: Test workflow contracts
        run: go test ./.github/scripts
