name: Validate Workflows

on:
  push:
    branches: [main]
  pull_request:

# The source sanitizer must run for every file type, including documentation,
# fixtures, and generated assets. Path filters would create an avoidable gap.

permissions:
  contents: read
  pull-requests: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: reviewdog/action-actionlint@dbe5299849118fd6f099ba563d263d770955a64a # v1.73.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install pinned Python linter
        run: python3 -m pip install --require-hashes -r .github/scripts/requirements-lint.txt
      - name: Lint sandbox enrollment recovery
        run: make lint-python
      - name: Require tested AWS CLI major
        run: |
          set -euo pipefail
          if ! aws_version=$(aws --version 2>&1); then
            echo "::error::enrollment recovery tests require AWS CLI v2, but aws is unavailable"
            exit 1
          fi
          if [[ ! "$aws_version" =~ ^aws-cli/2\. ]]; then
            echo "::error::enrollment recovery tests require AWS CLI v2"
            exit 1
          fi
      - name: Test sandbox enrollment recovery
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 .github/scripts/prepare_headless_enrollment_test.py
      - name: Test workflow contracts
        run: go test ./.github/scripts
