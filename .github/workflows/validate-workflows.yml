name: Validate Workflows

on:
  push:
    branches: [main]
  pull_request:

# The source sanitizer must run for every file type, including documentation,
# fixtures, and generated assets. Path filters would create an avoidable gap.

permissions:
  contents: read
  pull-requests: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: reviewdog/action-actionlint@d290e336d5a743810aef4404f757dc862276d2ae # v1.73.4
      # Keep the public-source security boundary in the established required
      # check until Enrollment recovery is required after this workflow lands.
      - name: Test public-source sanitizer
        run: go test ./.github/scripts

  enrollment-recovery:
    name: Enrollment recovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install pinned Python linter
        run: python3 -m pip install --require-hashes -r .github/scripts/requirements-lint.txt
      - name: Check sandbox enrollment recovery
        run: make check-python
