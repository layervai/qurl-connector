name: Validate Workflows

on:
  push:
    branches: [main]
  pull_request:

# The source sanitizer must run for every file type, including documentation,
# fixtures, and generated assets. Path filters would create an avoidable gap.

permissions:
  contents: read
  pull-requests: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: reviewdog/action-actionlint@dbe5299849118fd6f099ba563d263d770955a64a # v1.73.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test workflow contracts
        run: go test ./.github/scripts
